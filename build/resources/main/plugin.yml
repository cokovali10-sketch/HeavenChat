name: HeavenChat
version: 1.6.0
main: com.vitalis.chat.HeavenChat
api-version: "1.21"
author: Vitalis
description: "Whispers /w /r with clickable reply + mentions. Purpur/Paper 1.21.11."
depend: []
softdepend: [LuckPerms, HeavenTitles]
commands:
  w:
    description: "Whisper: /w <nick> <text>."
    usage: "/w <ник> <текст>"
  r:
    description: "Reply to whisper: /r <text>."
    usage: "/r <текст>"
permissions:
  heavenchat.use:
    description: "Whispers and mentions."
    default: true
  heavenchat.admin:
    description: "Reload config."
    default: op
